name: MLOps Pipeline

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main

jobs:
  data-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run data checks
        run: ./scripts/data-checks.sh

  train:
    runs-on: ubuntu-latest
    needs: data-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Train model
        run: ./scripts/train-model.sh

  evaluate:
    runs-on: ubuntu-latest
    needs: train
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Evaluate model
        run: ./scripts/evaluate-model.sh

  register:
    runs-on: ubuntu-latest
    needs: evaluate
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Register model
        run: ./scripts/register-model.sh

  deploy:
    runs-on: ubuntu-latest
    needs: register
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Deploy model
        run: ./scripts/deploy-model.sh